[project]
name = "optifisc"
version = "0.1.0"
description = "Pilotage de l'impôt sur les sociétés en cours d'exercice (Bénin, CGI 2026) — prototype du mémoire DECOFI"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",     # interface
    "pyyaml>=6.0",         # lecture du référentiel
    "pydantic>=2.6",       # validation du référentiel
    "openpyxl>=3.1",       # balances Excel et dossier de calcul
    "xlrd>=2.0",           # anciennes balances .xls
    "python-docx>=1.1",    # note de pilotage et lettre au DGI
    "rank-bm25>=0.2.2",    # recherche d'articles
    "requests>=2.31",      # appels à OpenRouter
    "python-dotenv>=1.0",  # lecture du fichier .env
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Règles retenues : erreurs (E, F), avertissements (W), ordre des imports (I), pièges courants (B)
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Le modèle de lettre au DGI garde ses paragraphes sur une ligne, pour rester lisible comme un texte.
"src/optifisc/infrastructure/livrables/word.py" = ["E501"]

[tool.setuptools.package-data]
optifisc = ["infrastructure/persistance/migrations/*.sql"]
